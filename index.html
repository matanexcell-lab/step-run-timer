<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101418">
<title>מד ריצה לפי צעדים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#101418;--card:#1a2026;--ink:#eef2f5;--mute:#8b98a5;--run:#ff6b35;--walk:#3fb6a8;--stop:#56616c}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:20px;font-weight:500;margin:0 0 14px;color:var(--mute)}
.state{border-radius:22px;padding:22px 18px;text-align:center;background:var(--stop);transition:background .4s}
.state.RUN{background:var(--run)}.state.WALK{background:var(--walk)}
.state .lbl{font-size:44px;font-weight:700;line-height:1.05}
.state .spm{font-size:18px;opacity:.9;margin-top:6px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.box{background:var(--card);border-radius:16px;padding:14px}
.box .k{font-size:14px;color:var(--mute)}
.box .v{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.box.run .v{color:var(--run)}.box.walk .v{color:var(--walk)}
.bar{height:14px;border-radius:7px;background:var(--card);overflow:hidden;margin-top:12px;display:flex}
.bar i{display:block;height:100%;transition:width .5s}
.pct{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-top:6px}
button{font:inherit;font-size:20px;font-weight:700;border:0;border-radius:16px;padding:16px;width:100%;margin-top:16px;cursor:pointer;color:#101418;background:var(--ink);min-height:56px}
button.stop{background:#e5484d;color:#fff}
button.ghost{background:var(--card);color:var(--ink);font-size:16px;font-weight:500;margin-top:10px;min-height:48px}
.set{background:var(--card);border-radius:16px;padding:14px;margin-top:16px}
.set label{display:flex;justify-content:space-between;font-size:15px}
input[type=range]{width:100%;accent-color:var(--run);height:36px}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.err{background:#3a1d1f;color:#ffb4b4;border-radius:12px;padding:12px;margin-top:12px;font-size:15px;display:none}
h2{font-size:17px;margin:26px 0 8px}
.hist{list-style:none;padding:0;margin:0}
.hist li{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:15px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hist b{color:var(--run)}
.dbg{font-size:12px;color:var(--mute);margin-top:6px;direction:ltr;text-align:center;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <h1>מד ריצה לפי צעדים</h1>

  <div class="state" id="state"><div class="lbl" id="lbl">מוכן</div><div class="spm" id="spm">— צעדים/דקה</div></div>

  <div class="grid">
    <div class="box run"><div class="k">זמן ריצה</div><div class="v" id="tRun">0:00</div></div>
    <div class="box walk"><div class="k">זמן הליכה</div><div class="v" id="tWalk">0:00</div></div>
    <div class="box"><div class="k">צעדים</div><div class="v" id="steps">0</div></div>
    <div class="box"><div class="k">זמן כולל</div><div class="v" id="tTot">0:00</div></div>
  </div>

  <div class="bar"><i id="bRun" style="width:0;background:var(--run)"></i><i id="bWalk" style="width:0;background:var(--walk)"></i></div>
  <div class="pct"><span id="pRun">ריצה 0%</span><span id="pWalk">הליכה 0%</span></div>

  <button id="go">התחל</button>
  <div class="err" id="err"></div>
  <div class="dbg" id="dbg"></div>

  <div class="set">
    <label for="thr"><span>סף ריצה</span><span id="thrV">140 צעדים/דקה</span></label>
    <input type="range" id="thr" min="110" max="170" step="5" value="140">
    <label for="sens"><span>רגישות זיהוי צעד</span><span id="sensV">בינונית</span></label>
    <input type="range" id="sens" min="1" max="5" step="1" value="3">
    <div class="note">מעל הסף זה נספר כריצה, מתחת לסף כהליכה, ואם לא זוהה צעד במשך 3 שניות זה נספר כעמידה. החזק את הטלפון ביד או שים אותו ברצועה על הזרוע, והשאר את המסך דלוק.</div>
  </div>

  <h2>אימונים קודמים</h2>
  <ul class="hist" id="hist"></ul>
  <button class="ghost" id="clr">מחק היסטוריה</button>
</main>

<script>
{
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; };
const NAMES = {RUN:'רץ', WALK:'הולך', STOP:'עומד'};
const SENS = [null, {t:2.2,n:'נמוכה מאוד'}, {t:1.6,n:'נמוכה'}, {t:1.1,n:'בינונית'}, {t:0.8,n:'גבוהה'}, {t:0.55,n:'גבוהה מאוד'}];

let running = false, wake = null, timer = null;
let steps = [], totalSteps = 0, sec = {RUN:0, WALK:0, STOP:0}, startT = 0, lastTick = 0, cur = 'STOP';
// signal processing state
let lp = 9.8, avg = 9.8, above = false, peak = 0, lastStep = 0;

let thr = 140, sensT = 1.1;
try { thr = +localStorage.getItem('thr') || 140; const s = +localStorage.getItem('sens') || 3; $('sens').value = s; sensT = SENS[s].t; } catch(e) {}
$('thr').value = thr;
const showSet = () => { $('thrV').textContent = `${thr} צעדים/דקה`; $('sensV').textContent = SENS[$('sens').value].n; };
showSet();
$('thr').oninput = e => { thr = +e.target.value; showSet(); try{localStorage.setItem('thr', thr)}catch(e){} };
$('sens').oninput = e => { sensT = SENS[e.target.value].t; showSet(); try{localStorage.setItem('sens', e.target.value)}catch(e){} };

function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  const mag = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
  const now = performance.now();
  lp += 0.35 * (mag - lp);          // smooth out jitter
  avg += 0.02 * (lp - avg);         // slow baseline (~gravity)
  const d = lp - avg;
  if (!above && d > sensT) { above = true; peak = d; }
  else if (above) {
    if (d > peak) peak = d;
    if (d < sensT * 0.3) {           // falling back = one step completed
      above = false;
      if (now - lastStep > 250) {     // max ~240 steps/min, rejects double counts
        lastStep = now; steps.push(now); totalSteps++;
      }
    }
  }
}

function spmNow(now) {
  const win = 6000;
  while (steps.length && now - steps[0] > win) steps.shift();
  if (steps.length < 3 || now - steps[steps.length-1] > 3000) return 0;
  const span = steps[steps.length-1] - steps[0];
  return span > 0 ? (steps.length - 1) / span * 60000 : 0;
}

function tick() {
  const now = performance.now(), dt = (now - lastTick) / 1000; lastTick = now;
  const spm = spmNow(now);
  cur = spm === 0 ? 'STOP' : spm >= thr ? 'RUN' : 'WALK';
  sec[cur] += dt;
  render(spm, now);
}

function render(spm, now) {
  $('state').className = 'state ' + (running ? cur : '');
  $('lbl').textContent = running ? NAMES[cur] : 'מוכן';
  $('spm').textContent = (spm ? Math.round(spm) : '—') + ' צעדים/דקה';
  $('tRun').textContent = fmt(sec.RUN); $('tWalk').textContent = fmt(sec.WALK);
  $('steps').textContent = totalSteps;
  $('tTot').textContent = fmt(running ? (now - startT)/1000 : sec.RUN + sec.WALK + sec.STOP);
  const mv = sec.RUN + sec.WALK, pr = mv ? sec.RUN / mv * 100 : 0;
  $('bRun').style.width = pr + '%'; $('bWalk').style.width = (mv ? 100 - pr : 0) + '%';
  $('pRun').textContent = `ריצה ${Math.round(pr)}%`; $('pWalk').textContent = `הליכה ${mv ? Math.round(100-pr) : 0}%`;
}

function showErr(m) { $('err').textContent = m; $('err').style.display = 'block'; }

async function start() {
  $('err').style.display = 'none';
  if (typeof DeviceMotionEvent === 'undefined') return showErr('הדפדפן הזה לא תומך בחיישן תנועה.');
  if (!window.isSecureContext) return showErr('צריך לפתוח את העמוד בכתובת https (למשל GitHub Pages).');
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    try { if (await DeviceMotionEvent.requestPermission() !== 'granted') return showErr('לא ניתנה הרשאה לחיישן התנועה.'); }
    catch(e) { return showErr('לא ניתנה הרשאה לחיישן התנועה.'); }
  }
  steps = []; totalSteps = 0; sec = {RUN:0, WALK:0, STOP:0}; cur = 'STOP';
  lp = avg = 9.8; above = false; lastStep = 0;
  let got = false;
  const probe = () => { got = true; window.removeEventListener('devicemotion', probe); };
  window.addEventListener('devicemotion', probe);
  window.addEventListener('devicemotion', onMotion);
  setTimeout(() => { if (running && !got) showErr('לא מתקבלים נתונים מהחיישן. ב-Chrome: הגדרות ← הגדרות אתר ← חיישני תנועה ← לאפשר.'); }, 2500);
  try { wake = await navigator.wakeLock?.request('screen'); } catch(e) {}
  running = true; startT = lastTick = performance.now();
  timer = setInterval(tick, 1000);
  $('go').textContent = 'עצור'; $('go').className = 'stop';
}

function stop() {
  running = false; clearInterval(timer);
  window.removeEventListener('devicemotion', onMotion);
  try { wake?.release(); } catch(e) {} wake = null;
  $('go').textContent = 'התחל'; $('go').className = '';
  const mv = sec.RUN + sec.WALK;
  if (mv > 10) saveHist({d: Date.now(), run: sec.RUN, walk: sec.WALK, stop: sec.STOP, steps: totalSteps});
  render(0, performance.now());
}

// keep the screen awake again after returning to the page
document.addEventListener('visibilitychange', async () => {
  if (running && document.visibilityState === 'visible') { try { wake = await navigator.wakeLock?.request('screen'); } catch(e) {} lastTick = performance.now(); }
});

$('go').onclick = () => running ? stop() : start();

function loadHist() { try { return JSON.parse(localStorage.getItem('hist') || '[]'); } catch(e) { return []; } }
function saveHist(r) { const h = loadHist(); h.unshift(r); try { localStorage.setItem('hist', JSON.stringify(h.slice(0, 50))); } catch(e) {} drawHist(); }
function drawHist() {
  const h = loadHist();
  $('hist').innerHTML = h.length ? h.map(r => {
    const mv = r.run + r.walk, p = mv ? Math.round(r.run / mv * 100) : 0;
    const dt = new Date(r.d).toLocaleString('he-IL', {day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit'});
    return `<li><span>${dt}</span><span>ריצה <b>${fmt(r.run)}</b> · הליכה ${fmt(r.walk)} · <b>${p}%</b></span></li>`;
  }).join('') : '<li>עדיין אין אימונים</li>';
}
$('clr').onclick = () => { try { localStorage.removeItem('hist'); } catch(e) {} drawHist(); };
drawHist(); render(0, 0);
}
</script>
</body>
</html>
